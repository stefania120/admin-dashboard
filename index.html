<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Admin Dashboard</title>
</head>

<body class="roboto-regular">
    <aside>
        <div class="center">
            <img src="./img/view-dashboard.svg" width="38" height="39" alt="dashboard" id="dashboard">
            <span id="dashboard-center">
                Dashboard
            </span>
        </div>
        <div class="center" id="home">
            <img src="./img/home.svg" width="21" height="17" alt="home" class="icon">
            <span class="text-center"> Home</span>
        </div>

        <div class="center">
            <img src="./img/card-account-details.svg" width="23" height="19" alt="profile" class="icon">
            <span class="text-center"> Profile</span>
        </div>
        <div class="center">
            <img src="./img/message-reply.svg" width="20" height="21" alt="message" class="icon">
            <span class="text-center"> Messages</span>
        </div>
        <div class="center">
            <img src="./img/clock-time-three.svg" width="20" height="20" alt="history" class="icon">
            <span class="text-center">History</span>
        </div>

        <div class="center">
            <img src="./img/note-multiple.svg" width="22" height="23" alt="task" class="icon">
            <span class="text-center">Tasks</span>
        </div>

        <div class="center" id="communities">
            <img src="./img/account-group.svg" width="26" height="15" alt="communities" class="icon">
            <span class="text-center">Communities</span>
        </div>

        <div class="center">
            <img src="./img/settings.svg" width="20" height="20" alt="settings" class="icon" id="settings">
            <span class="text-center">Settings</span>
        </div>

        <div class="center">
            <img src="./img/help-box.svg" width="20" height="20" alt="support" class="icon">
            <span class="text-center">Support</span>
        </div>
        <div class="center">
            <img src="./img/shield-check.svg" width="22" height="23" alt="privacy" class="icon">
            <span class="text-center">Privacy</span>
        </div>
    </aside>

    <nav>
        <div class="nav-top">
            <div class="search">
                <img src="./img/magnify.svg" width="40" height="50" alt="search">
                <form action="">
                    <input type="search" name="q" id="ricerca">
                </form>
            </div>

            <div class="cat-search">


                <img src="./img/bell-ring-outline.svg" width="22" height="22" alt="ring">
                <img src="./img/cat.png" width="50" height="48" alt="cat">
                <h2>Morgan Oakley</h2>

            </div>
        </div>
        <div class="nav-bottom">
            <img src="./img/cat.png" width="77" height="72" alt="cat">
            <div class="text-search">
                <div>
                    <strong>Hi there,</strong>
                    <h2>Morgan Oakley (@Morgan)</h2>
                </div>
            </div>
            <div class="container-bottons">
                <div class="bottons">
                    <form action="">
                        <input type="button" value="New" class="button-primary">
                        <input type="button" value="Upload" class="button-primary">
                        <input type="button" value="Share" class="button-primary">
                    </form>
                </div>
            </div>
        </div>
    </nav>
